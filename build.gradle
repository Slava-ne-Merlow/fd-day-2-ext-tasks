plugins { id 'org.jetbrains.kotlin.jvm' version '2.0.21' }
repositories { mavenCentral() }
def taskId = providers.gradleProperty('task').getOrElse('05-1')
def ids = ['05-1', '05-2', '08-1', '08-2', '26-1', '26-2']
if (!ids.contains(taskId)) throw new GradleException("Неизвестная задача: $taskId. Доступны: $ids")
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
sourceSets {
    main { kotlin { setSrcDirs(["solutions/$taskId"]) } }
    checker { java { srcDir 'checker' } }
}
tasks.register('checkTask', JavaExec) {
    dependsOn 'classes', 'checkerClasses'
    classpath = sourceSets.checker.runtimeClasspath
    mainClass = 'Checker'
    args taskId, sourceSets.main.runtimeClasspath.asPath, layout.projectDirectory.asFile.absolutePath
}
